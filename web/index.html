    /* Initial Skeleton Loader Styles */
    .initial-skeleton-container {
      width: 100%;
      min-height: 100vh;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }

    .skeleton-header {
      height: 80px;
      padding: 0 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      background-color: var(--bg-color);
    }

    .skeleton-nav-links {
      display: flex;
      align-items: center;
      gap: 32px;
    }

    .skeleton-content {
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 64px 48px;
      box-sizing: border-box;
    }

    .skeleton-box {
      background-color: var(--skeleton-base);
      border-radius: 2px;
      position: relative;
      overflow: hidden;
    }

    .skeleton-box::after {
      content: "";
      position: absolute;
      top: 0; right: 0; bottom: 0; left: 0;
      transform: translateX(-100%);
      background-image: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0) 0,
        rgba(255, 255, 255, 0.15) 30%,
        rgba(255, 255, 255, 0.35) 60%,
        rgba(255, 255, 255, 0)
      );
      animation: shimmer 1.5s infinite;
    }

    @keyframes shimmer {
      100% {
        transform: translateX(100%);
      }
    }

    .skeleton-hero {
      margin-bottom: 40px;
    }

    .skeleton-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .skeleton-card {
      height: 200px;
      background-color: var(--surface-color);
      border: 1px solid var(--border-color);
      padding: 20px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    @media (max-width: 768px) {
      .skeleton-header { padding: 0 20px; }
      .skeleton-content { padding: 32px 20px; }
      .skeleton-nav-links { display: none; }
      .skeleton-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
      .skeleton-card { height: 180px; padding: 14px; }
    }
  </style>
