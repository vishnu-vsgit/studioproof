  <!-- PWA Service Worker Registration & Installation Handler -->
  <script>
    function dismissKalaaPreloader() {
      const loader = document.getElementById('kalaa-preloader');
      if (loader && !loader.classList.contains('fade-out')) {
        loader.classList.add('fade-out');
        setTimeout(function() {
          if (loader.parentNode) {
            loader.parentNode.removeChild(loader);
          }
        }, 300);
      }
    }

    // Dismiss preloader when Flutter renders initial frame or page load completes
    window.addEventListener('flutter-first-frame', dismissKalaaPreloader);
    if (document.readyState === 'complete') {
      setTimeout(dismissKalaaPreloader, 400);
    } else {
      window.addEventListener('load', function () {
        setTimeout(dismissKalaaPreloader, 400);
      });
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('flutter_service_worker.js?v=' + Date.now()).catch(function () {});
      });
    }

    // Capture PWA install prompt event
    window.deferredPwaPrompt = null;
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      window.deferredPwaPrompt = e;
    });
  </script>
